name: Verified development TV packages (no publication)
on:
  workflow_call:
    inputs:
      development_run:
        required: true
        type: string
    secrets:
      NUVIO_BUILD_PROPERTIES:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        platform: [tizen, webos]
    env:
      GH_TOKEN: ${{ github.token }}
      TEST_PLATFORM: ${{ matrix.platform }}
      NUVIO_PROPERTIES: ${{ github.workspace }}/../nuvio-test.properties
      NUVIO_TPK_CACHE: ${{ github.workspace }}/../nuvio-tpk-deps
      NUVIO_P2P_MOTOR: ${{ github.workspace }}/../webos-cache/engine
      NUVIO_BUILD_PLATFORM: linux/amd64
      NV_TPK_PACOTES: NuvioTpk
      NV_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require exact successful development evidence and assemble reviewed 2.0.4
        env:
          DEVELOPMENT_RUN: ${{ inputs.development_run }}
        run: |
          python3 test_packages.py "$TEST_PLATFORM" "$DEVELOPMENT_RUN"
          state=state.json
          if [ "$TEST_PLATFORM" = webos ]; then state=webos-state.json; fi
          python3 integration.py --platform "$TEST_PLATFORM" --state "$state"
          python3 - "$state" <<'PY'
          import json,sys
          from pathlib import Path
          s=json.loads(Path(sys.argv[1]).read_text())
          assert s['private_diagnostics']['production_enabled'] is False
          assert '#define NV_DIAG_VERIFIED 0' in Path('upstream/src/nvdiag_build.h').read_text()
          PY
      - name: Prepare existing shared service configuration and pinned engine/SDK
        env:
          BUILD_PROPERTIES: ${{ secrets.NUVIO_BUILD_PROPERTIES }}
        run: |
          test -n "$BUILD_PROPERTIES"
          umask 077
          printf '%s\n' "$BUILD_PROPERTIES" > "$NUVIO_PROPERTIES"
          if [ "$TEST_PLATFORM" = tizen ]; then
            python3 channel.py prepare --engine "$NUVIO_P2P_MOTOR"
          else
            python3 webos.py prepare
          fi
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: matrix.platform == 'tizen'
        with:
          dotnet-version: '8.0.425'
      - name: Install pinned packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zstd
          if [ "$TEST_PLATFORM" = tizen ]; then
            curl --retry 3 --retry-delay 5 --connect-timeout 30 -fsSL https://raw.githubusercontent.com/Samsung/Tizen.NET/6ab8cb41e7ccab90a3ba838e7f6d6b38a9c4ec08/workload/scripts/workload-install.sh -o "$RUNNER_TEMP/tizen-workload.sh"
            bash "$RUNNER_TEMP/tizen-workload.sh" -v 10.0.120 -t 8.0.400 -d "$DOTNET_ROOT"
          else
            npm install --prefix "$RUNNER_TEMP/lg-cli" --no-audit --no-fund @webos-tools/cli@3.2.6
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        if: matrix.platform == 'tizen'
        with:
          platforms: arm
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: tizen-cache
        if: matrix.platform == 'tizen'
        with:
          path: ${{ github.workspace }}/../nuvio-tpk-deps
          key: tizen8-arm-deps-${{ hashFiles('upstream/tools/tpk.sh', 'upstream/tools/tpk/deps.sh', 'upstream/tools/tpk/Dockerfile', 'channel.py') }}-test-${{ github.run_id }}
          restore-keys: tizen8-arm-deps-${{ hashFiles('upstream/tools/tpk.sh', 'upstream/tools/tpk/deps.sh', 'upstream/tools/tpk/Dockerfile', 'channel.py') }}-
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: webos-cache
        if: matrix.platform == 'webos'
        with:
          path: ${{ runner.temp }}/webos-cache
          key: webos-native-v1-${{ hashFiles('upstream/tools/Dockerfile', 'upstream/tools/build-ass-arm.sh', 'upstream/tools/build-dts-ffmpeg.sh', 'upstream/tools/p2p-motor/build-arm.sh') }}-test-${{ github.run_id }}
          restore-keys: webos-native-v1-${{ hashFiles('upstream/tools/Dockerfile', 'upstream/tools/build-ass-arm.sh', 'upstream/tools/build-dts-ffmpeg.sh', 'upstream/tools/p2p-motor/build-arm.sh') }}-
      - name: Build and inspect actual ARM packages
        id: native
        run: |
          if [ "$TEST_PLATFORM" = tizen ]; then
            bash tizen-build.sh
            dotnet run --project upstream/tests/mdblist_channel/Checks.csproj -c Release -- upstream/build/tpk/libnuvio.so upstream/build/mdblist-shell.sha256
            python3 channel.py package
          else
            export NUVIO_P2P_MOTOR="$RUNNER_TEMP/webos-cache/engine"
            bash webos-build.sh
          fi
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && matrix.platform == 'tizen' && (steps.native.outcome == 'success' || steps.native.outcome == 'failure')
        with:
          path: ${{ github.workspace }}/../nuvio-tpk-deps
          key: ${{ steps.tizen-cache.outputs.cache-primary-key }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success() && matrix.platform == 'webos'
        with:
          path: ${{ runner.temp }}/webos-cache
          key: ${{ steps.webos-cache.outputs.cache-primary-key }}
      - name: Include test status and installation instructions
        run: |
          dest=release
          if [ "$TEST_PLATFORM" = webos ]; then dest=release-webos; fi
          cp TEST_PACKAGES.md "$dest/TEST_PACKAGES.md"
          printf 'Development test only; not frozen; no production publication.\nBuilder: %s\n' "$GITHUB_SHA" > "$dest/DEVELOPMENT-ONLY.txt"
          (cd "$dest" && sha256sum TEST_PACKAGES.md DEVELOPMENT-ONLY.txt >> SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-test-${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/
            release-webos/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary service configuration
        if: always()
        run: rm -f "$NUVIO_PROPERTIES"
