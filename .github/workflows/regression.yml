name: Full upstream regression suite
on:
  workflow_call:
    secrets:
      NUVIO_BUILD_PROPERTIES:
        required: true
    inputs:
      platform:
        type: string
        required: true
      force:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  select:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      build: ${{ steps.discover.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select the same stable upstream release
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          FORCE: ${{ inputs.force }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          if [ "$PLATFORM" = tizen ]; then
            python3 channel.py discover --run "$GITHUB_RUN_NUMBER" "${args[@]}"
            cp state.json regression-state.json
          else
            python3 webos.py discover --run "$GITHUB_RUN_NUMBER" "${args[@]}"
            cp webos-state.json regression-state.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.discover.outputs.build == 'true'
        with:
          name: ${{ inputs.platform }}-regression-selection
          path: regression-state.json
          if-no-files-found: error
  suite:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { shard: 8, os: ubuntu-24.04 }
          - { shard: 0, os: macos-15 }
          - { shard: 1, os: macos-15 }
          - { shard: 2, os: macos-15 }
          - { shard: 3, os: macos-15 }
          - { shard: 4, os: macos-15 }
          - { shard: 5, os: macos-15 }
          - { shard: 6, os: macos-15 }
          - { shard: 7, os: macos-15 }
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.platform }}-regression-selection
      - name: Assemble verified integration before testing
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
        run: python3 integration.py --platform "$PLATFORM" --state regression-state.json
      - name: Install native host test libraries
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          PLATFORM: ${{ inputs.platform }}
        run: python3 update_guard.py run --platform "$PLATFORM" --state regression-state.json --stage native-regression-libraries -- brew install sdl2 sdl2_image sdl2_ttf pkg-config libass fribidi ffmpeg mkvtoolnix bash ripgrep coreutils openssl@3
      - name: Install actual GLES rendering libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev xvfb xauth ffmpeg pkg-config ripgrep
      - name: Provision required cross-platform regression toolchains
        id: tools
        env:
          PLATFORM: ${{ inputs.platform }}
        run: python3 update_guard.py run --platform "$PLATFORM" --state regression-state.json --stage regression-toolchain-setup -- python3 regression_dependencies.py upstream ${{ matrix.shard }} 9
      - name: Install the pinned host SDK for real Tizen routing fixtures
        if: steps.tools.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Verify the SDK used by the actual routing fixtures
        if: steps.tools.outputs.dotnet == 'true'
        run: |
          printf 'NUVIO_DOTNET=%s\n' "$(command -v dotnet)" >> "$GITHUB_ENV"
          cd upstream
          test "$(dotnet --version)" = 8.0.425
      - name: Prepare shared app configuration for upstream account tests
        env:
          BUILD_PROPERTIES: ${{ secrets.NUVIO_BUILD_PROPERTIES }}
        run: |
          if [ -z "$BUILD_PROPERTIES" ]; then echo 'Shared app test configuration is missing.' >&2; exit 1; fi
          umask 077
          printf '%s\n' "$BUILD_PROPERTIES" > "$RUNNER_TEMP/regression.properties"
          python3 -c 'import pathlib,os;[print("::add-mask::"+line.split("=",1)[1].strip().strip(chr(34))) for line in pathlib.Path(os.environ["RUNNER_TEMP"],"regression.properties").read_text().splitlines() if "=" in line and line.split("=",1)[1].strip()]'
      - name: Execute the complete upstream gatekeeper suite
        env:
          PLATFORM: ${{ inputs.platform }}
          NUVIO_PROPERTIES: ${{ runner.temp }}/regression.properties
        run: |
          mkdir -p "$GITHUB_WORKSPACE/regression-logs"
          export TMPDIR="$GITHUB_WORKSPACE/regression-logs/"
          export NV_TMP="$TMPDIR/native-fixtures"
          mkdir -p "$NV_TMP"
          if [ "$RUNNER_OS" = macOS ]; then
            export PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix openssl@3)/bin:$PATH"
          fi
          export PYTHONPATH="$GITHUB_WORKSPACE/upstream/tests/stubs/host:${PYTHONPATH:-}"
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); fi
          "${display[@]}" python3 update_guard.py run --platform "$PLATFORM" --state regression-state.json --stage upstream-full-regression-tests -- python3 full_regression.py run upstream regression-state.json ${{ matrix.shard }} 9
      - name: Report actual regression failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
        run: python3 update_guard.py failure --platform "$PLATFORM" --state regression-state.json --stage upstream-full-regression-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.platform }}-regression-shard-${{ matrix.shard }}
          path: |
            regression-logs/**/*.log
            regression-logs/**/SUMMARY.txt
            regression-logs/**/execution.json
            diagnostics/
            regression-state.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary app configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/regression.properties"
  aggregate:
    needs: [select, suite]
    if: needs.select.outputs.build == 'true' && needs.suite.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ inputs.platform }}-regression-shard-*
          path: regression-shards
          merge-multiple: true
      - name: Verify every script was executed by its assigned native runner
        run: |
          mkdir -p regression-logs
          python3 full_regression.py merge regression-shards/regression-logs regression-state.json regression-logs/SUMMARY.txt 9
          python3 regression_gate.py attest regression-state.json regression-logs/SUMMARY.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.platform }}-full-regression-evidence
          path: |
            regression-state.json
            regression-logs/SUMMARY.txt
            regression-shards/
          if-no-files-found: error
          retention-days: 30
