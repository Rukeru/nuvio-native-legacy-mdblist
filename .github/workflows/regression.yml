name: Full upstream regression suite
on:
  workflow_call:
    outputs:
      evidence-artifact:
        value: ${{ jobs.aggregate.outputs.evidence-artifact }}
    secrets:
      NUVIO_BUILD_PROPERTIES:
        required: true
    inputs:
      platform:
        type: string
        required: true
      reviewed_baseline:
        type: boolean
        default: false
      force:
        type: boolean
        default: false
      diagnostic_only:
        type: boolean
        default: false
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}/scripts
  # Upstream's per-script limit (tools/testa-tudo.sh, default 120 s). Applies to
  # both our tree and the pristine rerun, so the gate stays like-for-like; shared
  # runners put several upstream fixtures within seconds of 120.
  TEST_TIMEOUT: '300'
jobs:
  select:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: read
    outputs:
      build: ${{ steps.discover.outputs.build || steps.baseline.outputs.build }}
      selection-artifact: ${{ inputs.platform }}-regression-selection-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select the same stable upstream release
        if: inputs.diagnostic_only != true
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
          FORCE: ${{ inputs.force }}
          REVIEWED_BASELINE: ${{ inputs.reviewed_baseline }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          if [ "$REVIEWED_BASELINE" = true ]; then args+=(--reviewed-baseline); fi
          if [ "$PLATFORM" = tizen ]; then
            python3 scripts/channel.py discover --run "$GITHUB_RUN_NUMBER" "${args[@]}"
            cp state.json regression-state.json
          else
            python3 scripts/webos.py discover --run "$GITHUB_RUN_NUMBER" "${args[@]}"
            cp webos-state.json regression-state.json
          fi
      - name: Select immutable baseline for nonpublishing CI validation
        if: inputs.diagnostic_only == true
        id: baseline
        run: |
          python3 - <<'PY'
          import integration,json,os
          from pathlib import Path
          m=integration.manifest()
          Path('regression-state.json').write_text(json.dumps({'upstream':{'tag_name':m['base_tag'],'id':0},
              'builder_commit':os.environ['GITHUB_SHA'],'expected_upstream_commit':m['base_commit'],
              'diagnostic_only':True,'build':True})+'\n')
          PY
          echo 'build=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.discover.outputs.build == 'true' || steps.baseline.outputs.build == 'true'
        with:
          name: ${{ inputs.platform }}-regression-selection-attempt-${{ github.run_attempt }}
          path: regression-state.json
          if-no-files-found: error
  suite:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # Two independent Linux workloads plus four macOS jobs. The prior
      # dual-platform runs already used five concurrent macOS runners overall;
      # this prevents a 30-minute Linux benchmark consuming a macOS slot.
      max-parallel: 6
      matrix:
        include:
          - { shard: 9, os: ubuntu-24.04 }
          - { shard: 8, os: ubuntu-24.04 }
          # Measured longest macOS shard first: SDK setup plus 25.6m of tests.
          # This changes submission order only, never partition or assertions.
          - { shard: 7, os: macos-15 }
          - { shard: 2, os: macos-15 }
          - { shard: 6, os: macos-15 }
          - { shard: 1, os: macos-15 }
          - { shard: 3, os: macos-15 }
          - { shard: 0, os: macos-15 }
          - { shard: 5, os: macos-15 }
          - { shard: 4, os: macos-15 }
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.select.outputs.selection-artifact }}
      - name: Assemble verified integration before testing
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
        run: python3 scripts/integration.py --platform "$PLATFORM" --state regression-state.json
      - name: Install native host test libraries
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          PLATFORM: ${{ inputs.platform }}
        run: python3 scripts/update_guard.py run --platform "$PLATFORM" --state regression-state.json --stage native-regression-libraries -- brew install sdl2 sdl2_image sdl2_ttf pkg-config libass fribidi ffmpeg mkvtoolnix bash ripgrep coreutils openssl@3 ccache
      - name: Install actual GLES rendering libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev xvfb xauth ffmpeg pkg-config ripgrep ccache
      - name: Provision required cross-platform regression toolchains
        id: tools
        env:
          PLATFORM: ${{ inputs.platform }}
        run: python3 scripts/update_guard.py run --platform "$PLATFORM" --state regression-state.json --stage regression-toolchain-setup -- python3 scripts/regression_dependencies.py upstream ${{ matrix.shard }} 10
      - name: Install the pinned host SDK for real Tizen routing fixtures
        if: steps.tools.outputs.dotnet == 'true'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Verify the SDK used by the actual routing fixtures
        if: steps.tools.outputs.dotnet == 'true'
        run: |
          printf 'NUVIO_DOTNET=%s\n' "$(command -v dotnet)" >> "$GITHUB_ENV"
          cd upstream
          test "$(dotnet --version)" = 8.0.425
      - name: Prepare shared app configuration for upstream account tests
        env:
          BUILD_PROPERTIES: ${{ secrets.NUVIO_BUILD_PROPERTIES }}
        run: |
          if [ -z "$BUILD_PROPERTIES" ]; then echo 'Shared app test configuration is missing.' >&2; exit 1; fi
          umask 077
          printf '%s\n' "$BUILD_PROPERTIES" > "$RUNNER_TEMP/regression.properties"
          python3 -c 'import pathlib,os;[print("::add-mask::"+line.split("=",1)[1].strip().strip(chr(34))) for line in pathlib.Path(os.environ["RUNNER_TEMP"],"regression.properties").read_text().splitlines() if "=" in line and line.split("=",1)[1].strip()]'
      - name: Build the real emulator artifact required by its original assertions
        if: steps.tools.outputs.emulator == 'true'
        timeout-minutes: 90
        env:
          NUVIO_PROPERTIES: ${{ runner.temp }}/regression.properties
        run: python3 scripts/emulator_fixture.py upstream
      - name: Define content-checked host object cache
        id: object-cache-key
        run: |
          echo "prefix=host-objects-v1-$RUNNER_OS-$RUNNER_ARCH-${ImageVersion:-unknown}-${{ matrix.shard }}-${{ hashFiles('scripts/ci_compile.py') }}" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$RUNNER_TEMP/nuvio-host-objects" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: object-cache
        with:
          path: ${{ runner.temp }}/nuvio-host-objects
          key: ${{ steps.object-cache-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: ${{ steps.object-cache-key.outputs.prefix }}-
      - name: Enable verified host compilation cache
        run: |
          python3 scripts/ci_compile.py install "$RUNNER_TEMP/nuvio-host-compiler"
          ccache --version
      - name: Execute the complete upstream gatekeeper suite
        env:
          PLATFORM: ${{ inputs.platform }}
          NUVIO_PROPERTIES: ${{ runner.temp }}/regression.properties
        run: |
          mkdir -p "$GITHUB_WORKSPACE/regression-logs"
          export TMPDIR="$GITHUB_WORKSPACE/regression-logs/"
          export NV_TMP="$TMPDIR/native-fixtures"
          mkdir -p "$NV_TMP"
          if [ "$RUNNER_OS" = macOS ]; then
            export PATH="$(brew --prefix coreutils)/libexec/gnubin:$(brew --prefix openssl@3)/bin:$PATH"
          fi
          export PYTHONPATH="$GITHUB_WORKSPACE/upstream/tests/stubs/host:${PYTHONPATH:-}"
          display=()
          if [ "$RUNNER_OS" = Linux ]; then display=(xvfb-run -a); fi
          "${display[@]}" python3 scripts/update_guard.py run --platform "$PLATFORM" --state regression-state.json --stage upstream-full-regression-tests -- python3 scripts/full_regression.py run upstream regression-state.json ${{ matrix.shard }} 10
      - name: Report actual regression failures
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ inputs.platform }}
        run: python3 scripts/update_guard.py failure --platform "$PLATFORM" --state regression-state.json --stage upstream-full-regression-tests
      - name: Record compilation cache diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          if command -v ccache >/dev/null; then ccache --show-stats > diagnostics/compiler-cache.txt; fi
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: success() && steps.object-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/nuvio-host-objects
          key: ${{ steps.object-cache-key.outputs.prefix }}-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ inputs.platform }}-regression-shard-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            regression-logs/**/*.log
            regression-logs/**/SUMMARY.txt
            regression-logs/**/UPSTREAM-SUMMARY.txt
            regression-logs/**/execution.json
            diagnostics/
            regression-state.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove temporary app configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/regression.properties"
  aggregate:
    needs: [select, suite]
    if: needs.select.outputs.build == 'true' && needs.suite.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      evidence-artifact: ${{ inputs.platform }}-full-regression-evidence-attempt-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ inputs.platform }}-regression-shard-*
          path: regression-attempts
          merge-multiple: false
      - name: Verify every script was executed by its assigned native runner
        run: |
          mkdir -p regression-logs
          python3 scripts/regression_attempts.py regression-attempts regression-selected "${{ inputs.platform }}" 10
          python3 scripts/full_regression.py merge regression-selected regression-state.json regression-logs/SUMMARY.txt 10
          python3 scripts/regression_gate.py attest regression-state.json regression-logs/SUMMARY.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.platform }}-full-regression-evidence-attempt-${{ github.run_attempt }}
          path: |
            regression-state.json
            regression-logs/SUMMARY.txt
            regression-attempts/
            regression-selected/
          if-no-files-found: error
          retention-days: 30
