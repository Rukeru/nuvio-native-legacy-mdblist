name: Fast development checks (not release validation)
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}/scripts
jobs:
  impact:
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.impact.outputs.native }}
      compiler: ${{ steps.impact.outputs.compiler }}
      backend: ${{ steps.impact.outputs.backend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Execute complete updater unit and safety tests
        run: python3 -m unittest discover -p 'test_*.py'
      - name: Select the conservative development gate
        id: impact
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="${PR_BASE:-$BEFORE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then base=HEAD^; fi
          python3 scripts/ci_impact.py --base "$base"
          cat development-impact.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-impact-attempt-${{ github.run_attempt }}
          path: development-impact.json
          if-no-files-found: error
  compiler-equivalence:
    needs: impact
    if: needs.impact.outputs.compiler == 'true'
    uses: ./.github/workflows/ci-experiment.yml
  backend-security:
    needs: impact
    if: needs.impact.outputs.backend == 'true'
    uses: ./.github/workflows/diagnostics.yml
  settings-account:
    needs: impact
    if: needs.impact.outputs.native == 'true'
    uses: ./.github/workflows/focused-ui.yml
  native-preflight:
    needs: impact
    if: needs.impact.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [tizen, webos]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare exact upstream baseline and maintained adapters
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import integration,json,os
          m=integration.manifest()
          Path('development-state.json').write_text(json.dumps({'upstream':{'tag_name':m['base_tag'],'id':0},
              'builder_commit':os.environ['GITHUB_SHA'],'expected_upstream_commit':m['base_commit'],
              'diagnostic_only':True})+'\n')
          PY
          python3 scripts/integration.py --platform "$PLATFORM" --state development-state.json
      - name: Install minimal host headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles2-mesa-dev zlib1g-dev
      - name: Run actual tracking, history, Settings and platform assertions
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          bash scripts/preflight.sh "$PLATFORM"
          bash scripts/platform-checks.sh "$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: development-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: |
            development-state.json
            diagnostics/
          retention-days: 14

  discovery-linkage:
    needs: impact
    if: needs.impact.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assemble exact repaired fixture source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import integration,json,os
          m=integration.manifest()
          Path('link-state.json').write_text(json.dumps({'upstream':{'tag_name':m['base_tag'],'id':0},'builder_commit':os.environ['GITHUB_SHA'],'expected_upstream_commit':m['base_commit'],'diagnostic_only':True})+'\n')
          PY
          python3 scripts/integration.py --platform tizen --state link-state.json
      - name: Install fixture dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install sdl2 sdl2_image sdl2_ttf pkg-config ccache
          else
            sudo apt-get update -qq
            sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles2-mesa-dev zlib1g-dev
          fi
      - name: Execute affected original assertions with the production registry
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/upstream/tests/stubs/host:${PYTHONPATH:-}"
          export CPATH="$(sdl2-config --prefix)/include:${CPATH:-}"
          fixtures=()
          if [ "$RUNNER_OS" = macOS ]; then
            while IFS= read -r fixture; do fixtures+=("$fixture"); done < <(python3 - <<'PY'
          import integration
          for c in integration.manifest()['components']:
              if c['name']=='discovery-fixture-linkage':
                  for p in c['files']:
                      assert p.startswith('tests/') and p.endswith('.sh')
                      print(p)
          PY
            )
          else
            fixtures=(tests/home_progressiva.sh tests/montagem_cedo.sh)
          fi
          test "${#fixtures[@]}" -gt 0
          python3 scripts/ci_benchmark.py upstream linkage-evidence focused-discovery-linkage "${fixtures[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: discovery-linkage-${{ runner.os }}-attempt-${{ github.run_attempt }}
          path: |
            linkage-evidence/
            link-state.json
          if-no-files-found: error
  native-rendering:
    needs: impact
    if: needs.impact.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assemble exact reviewed native source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import integration,json,os
          m=integration.manifest()
          Path('render-state.json').write_text(json.dumps({'upstream':{'tag_name':m['base_tag'],'id':0},'builder_commit':os.environ['GITHUB_SHA'],'expected_upstream_commit':m['base_commit'],'diagnostic_only':True})+'\n')
          PY
          python3 scripts/integration.py --platform tizen --state render-state.json
      - name: Install native renderer fixture libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libgles2-mesa-dev libegl1-mesa-dev zlib1g-dev xvfb pkg-config
      - name: Render actual native Discover and partial Profile snapshots
        run: bash upstream/tests/discover_render.sh "$GITHUB_WORKSPACE/render-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-discover-profile-render-attempt-${{ github.run_attempt }}
          path: |
            render-state.json
            render-evidence/
            diagnostics/
          if-no-files-found: error
