name: Diagnose reviewed upstream assertions without publication
on:
  workflow_dispatch:
    inputs:
      fixture:
        description: Original upstream assertion fixture to compare
        type: choice
        default: home_progressiva
        options: [compatibility, player_retido, ctxlista, dts_engine, hero_vizinhos, player, ondever_folha, home_progressiva, ilha_voo_cw, spainel_fundo_tempo, texbruto, streamfit_sheet, trailer-hero-contract, tpk-escolha, salvos_segurar, montagem_cedo, release_205_linkage]
      integrated:
        description: Apply the verified current integration for focused debugging
        type: boolean
        default: false
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}/scripts
jobs:
  baseline:
    if: inputs.fixture != 'dts_engine'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch immutable upstream source without integration
        run: |
          git clone --no-checkout https://github.com/iqui27/nuvio-native-legacy.git baseline
          git -C baseline checkout --detach 17bb330373273a3de284d7f2898a3a3e16f1fc3f
      - name: Apply verified integration only when explicitly selected
        if: inputs.integrated
        run: |
          mkdir -p baseline-evidence
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          import integration
          source='17bb330373273a3de284d7f2898a3a3e16f1fc3f'
          assert integration.git('baseline','rev-parse','HEAD').strip()==source
          state={'upstream':{'tag_name':'v2.0.5','id':0},'upstream_commit':source,
                 'builder_commit':os.environ['GITHUB_SHA'],'diagnostic_only':True}
          integration.apply(Path('baseline').resolve(),'tizen',state)
          Path('baseline-evidence/compatibility-state.json').write_text(json.dumps(state,indent=2)+'\n')
          PY
      - name: Install original host dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install sdl2 sdl2_image sdl2_ttf pkg-config ffmpeg bash ripgrep coreutils
      - name: Provision exact focused fixture dependencies
        id: tools
        if: inputs.fixture == 'compatibility'
        run: |
          python3 - <<'PY'
          from regression_dependencies import provision
          provision('baseline',0,1,selected=['tests/player.sh','tests/player_retido.sh','tests/ctxlista.sh','tests/streamfit_sheet.sh','tests/hero_vizinhos.sh','tests/ondever_folha.sh','tests/salvos_segurar.sh'])
          PY
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: steps.tools.outputs.dotnet == 'true'
        with:
          dotnet-version: '8.0.425'
      - name: Measure host quiet-poll overhead without changing fixture assertions
        if: inputs.fixture == 'montagem_cedo'
        run: |
          mkdir -p baseline-evidence
          cat > baseline-evidence/quiet-poll.c <<'C'
          #include <stdio.h>
          #include <unistd.h>
          #include <time.h>
          static unsigned long long ms(void) {
            struct timespec t; clock_gettime(CLOCK_MONOTONIC, &t);
            return (unsigned long long)t.tv_sec * 1000 + t.tv_nsec / 1000000;
          }
          int main(void) {
            unsigned long long start = ms();
            for (int i = 0; i < 150; i++) usleep(2000);
            printf("150 original quiet polls: %llu ms (nominal 300 ms)\n", ms()-start);
            return 0;
          }
          C
          cc -O1 baseline-evidence/quiet-poll.c -o baseline-evidence/quiet-poll
          baseline-evidence/quiet-poll | tee baseline-evidence/quiet-poll.log
      - name: Observe original helper phases without changing assertions or waits
        if: inputs.fixture == 'montagem_cedo'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('baseline/tests/montagem_cedo.c')
          s=p.read_text()
          a='static void esperarQuieto(void) {\n  int i, quieto = 0;'
          b=a+'\n  unsigned long long probeStart = agoraMs(), probeQuiet;'
          assert s.count(a)==1
          s=s.replace(a,b)
          a='  for (i = 0; i < 10000 && quieto < 150; i++) {'
          assert s.count(a)==1
          s=s.replace(a,'  probeQuiet = agoraMs();\n'+a)
          a='  assert(quieto >= 150);'
          assert s.count(a)==1
          s=s.replace(a,'  fprintf(stderr, "[fixture-timing] start-wait=%llu ms, quiet-wait=%llu ms, polls=%d\\n", probeQuiet-probeStart, agoraMs()-probeQuiet, quieto);\n'+a)
          p.write_text(s)
          PY
      - name: Execute original assertions and retain each fixture result
        env:
          FIXTURE: ${{ inputs.fixture }}
        run: |
          case "$FIXTURE" in compatibility|player_retido|ctxlista|hero_vizinhos|player|ondever_folha|home_progressiva|ilha_voo_cw|spainel_fundo_tempo|texbruto|streamfit_sheet|trailer-hero-contract|tpk-escolha|salvos_segurar|montagem_cedo|release_205_linkage) ;; *) exit 2;; esac
          mkdir -p baseline-evidence
          export TMPDIR="$GITHUB_WORKSPACE/baseline-evidence/"
          export PYTHONPATH="$GITHUB_WORKSPACE/baseline/tests/stubs/host:${PYTHONPATH:-}"
          set -o pipefail
          if command -v dotnet >/dev/null 2>&1; then export NUVIO_DOTNET="$(command -v dotnet)"; fi
          fixtures="$FIXTURE"
          if [ "$FIXTURE" = compatibility ]; then fixtures='player streamfit_sheet hero_vizinhos ondever_folha salvos_segurar ctxlista player_retido'; fi
          if [ "$FIXTURE" = release_205_linkage ]; then fixtures='fimfileira bordafileira ajustes_creditos biblioteca_filtro logorapido cwleg streams_idade cwinicio streamfit_sheet legauto fontesmortas posplay_recuo'; fi
          failed=0
          for test in $fixtures; do
            if bash "baseline/tests/$test.sh" >"baseline-evidence/$test.log" 2>&1; then
              echo "PASS $test"
            else
              echo "FAIL $test"
              failed=1
            fi
            cat "baseline-evidence/$test.log"
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic-204-${{ inputs.fixture }}-${{ inputs.integrated }}
          path: |
            baseline-evidence/**/*.log
            baseline-evidence/compatibility-state.json
          retention-days: 14
  portable:
    if: inputs.fixture == 'compatibility' || inputs.fixture == 'dts_engine'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJSON(inputs.fixture == 'compatibility' && '["tpk_lifecycle","dts_engine"]' || '["dts_engine"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare the exact same verified source for Linux timing assertions
        env:
          INTEGRATED: ${{ inputs.integrated }}
        run: |
          git clone --no-checkout https://github.com/iqui27/nuvio-native-legacy.git baseline
          git -C baseline checkout --detach 17bb330373273a3de284d7f2898a3a3e16f1fc3f
          mkdir -p baseline-evidence
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          import integration
          source='17bb330373273a3de284d7f2898a3a3e16f1fc3f'
          assert integration.git('baseline','rev-parse','HEAD').strip()==source
          state={'upstream':{'tag_name':'v2.0.5','id':0},'upstream_commit':source,
                 'builder_commit':os.environ['GITHUB_SHA'],'diagnostic_only':True}
          if os.environ['INTEGRATED']=='true':integration.apply(Path('baseline').resolve(),'tizen',state)
          Path('baseline-evidence/compatibility-state.json').write_text(json.dumps(state,indent=2)+'\n')
          PY
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        if: matrix.fixture == 'tpk_lifecycle'
        with:
          dotnet-version: '8.0.425'
      - name: Install actual transport fixture dependencies
        if: matrix.fixture == 'dts_engine'
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential ffmpeg pkg-config curl
      - name: Build the pinned real decoder for transport assertions
        if: matrix.fixture == 'dts_engine'
        run: |
          python3 - <<'PY'
          from regression_dependencies import provision
          provision('baseline',0,1,selected=['tests/dts_engine.sh'])
          PY
      - name: Execute every original portable assertion and deadline
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          if [ "$FIXTURE" = tpk_lifecycle ]; then
            test "$(dotnet --version)" = 8.0.425
            export NUVIO_DOTNET="$(command -v dotnet)"
          fi
          export NUVIO_HOST_TEST_DIR="$GITHUB_WORKSPACE/baseline-evidence"
          export PYTHONPATH="$GITHUB_WORKSPACE/baseline/tests/stubs/host:${PYTHONPATH:-}"
          set -o pipefail
          bash "baseline/tests/$FIXTURE.sh" 2>&1 | tee "baseline-evidence/$FIXTURE.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: diagnostic-204-${{ matrix.fixture }}-${{ inputs.integrated }}
          path: |
            baseline-evidence/**/*.log
            baseline-evidence/compatibility-state.json
          retention-days: 14
