name: Verify real 2.0.5 emulator package without publication
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}/scripts
jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assemble exact reviewed source
        run: |
          git clone --no-checkout https://github.com/iqui27/nuvio-native-legacy.git upstream
          git -C upstream checkout --detach 17bb330373273a3de284d7f2898a3a3e16f1fc3f
          python3 - <<'PYCODE'
          import os,json
          from pathlib import Path
          import integration
          sha='17bb330373273a3de284d7f2898a3a3e16f1fc3f'
          state={'upstream':{'tag_name':'v2.0.5','id':0},'upstream_commit':sha,
                 'builder_commit':os.environ['GITHUB_SHA'],'diagnostic_only':True}
          integration.apply(Path('upstream').resolve(),'tizen',state)
          Path('emulator-state.json').write_text(json.dumps(state,indent=2)+'\n')
          PYCODE
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.425'
      - name: Install native packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick zip unzip
      - name: Prepare shared application configuration
        env:
          BUILD_PROPERTIES: ${{ secrets.NUVIO_BUILD_PROPERTIES }}
        run: |
          test -n "$BUILD_PROPERTIES"
          umask 077
          printf '%s\n' "$BUILD_PROPERTIES" > "$RUNNER_TEMP/emulator.properties"
      - name: Build real package and run original assertions
        env:
          NUVIO_PROPERTIES: ${{ runner.temp }}/emulator.properties
        run: |
          set -o pipefail
          python3 scripts/emulator_fixture.py upstream 2>&1 | tee emulator-build.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: real-emulator-verification
          path: |
            emulator-state.json
            emulator-build.log
          if-no-files-found: error
