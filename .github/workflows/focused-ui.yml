name: Focused Settings and account regressions
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  PYTHONPATH: ${{ github.workspace }}/scripts
jobs:
  settings-account:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Assemble immutable development source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import integration,json,os
          m=integration.manifest()
          Path('focused-state.json').write_text(json.dumps({'upstream':{'tag_name':m['base_tag'],'id':0},
              'builder_commit':os.environ['GITHUB_SHA'],'expected_upstream_commit':m['base_commit'],
              'diagnostic_only':True})+'\n')
          PY
          python3 scripts/integration.py --platform tizen --state focused-state.json
      - name: Install native fixture libraries
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install sdl2 sdl2_image sdl2_ttf pkg-config ccache
      - name: Set content-checked object cache
        id: cache-key
        run: |
          echo "prefix=focused-ui-v1-$RUNNER_OS-$RUNNER_ARCH-${ImageVersion:-unknown}-${{ hashFiles('scripts/ci_compile.py') }}" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$RUNNER_TEMP/focused-ui-objects" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/focused-ui-objects
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}-
      - name: Enable verified compilation cache
        run: python3 scripts/ci_compile.py install "$RUNNER_TEMP/focused-ui-compiler"
      - name: Verify optional observers yield to real providers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,tempfile
          with tempfile.TemporaryDirectory() as d:
              d=Path(d)
              (d/'caller.c').write_text('#include "nvdiag_observe.h"\nvoid exercise(void){NVD_NOTE(NVD_SYNC_FAILED,2,3);}')
              (d/'provider.c').write_text('#include <assert.h>\nstatic int called; void nvdiag_observe(int c,int a,int b){assert(c==2&&a==2&&b==3);called++;} void exercise(void); int main(void){exercise();assert(called==1);}')
              binary=d/'provider-test'
              subprocess.run(['cc','-O1','-DNV_DIAG_VERIFIED=1','-Iupstream/src',str(d/'caller.c'),str(d/'provider.c'),'-o',str(binary)],check=True)
              subprocess.run([str(binary)],check=True)
          PY
      - name: Execute real Settings navigation and account fixtures
        run: |
          # Same loopback server-name setup as the full regression environment.
          # Client DNS, real sockets, TLS, deadlines and throughput stay unchanged.
          export PYTHONPATH="$GITHUB_WORKSPACE/upstream/tests/stubs/host:${PYTHONPATH:-}"
          # Diagnose the confirmed assertion/linker failures first. The remaining
          # development fixtures run only after these exact checks succeed.
          python3 scripts/ci_benchmark.py upstream focused-evidence/confirmed-repairs focused-repairs \
            tests/ajustes_ux_dados.sh tests/tizen_improvements.sh \
            tests/armazenamento.sh tests/dados-persistencia.sh tests/syncaddons.sh tests/trakt_scrobble.sh
          python3 scripts/ci_benchmark.py upstream focused-evidence focused-development \
            tests/ajustes_ux_interacao.sh \
            tests/discover.sh tests/menu_ocultos.sh tests/menu_geometry.sh tests/player.sh tests/profilestats.sh tests/ajustes_perfil.sh \
            tests/ajustes_envio_auto.sh tests/i18n.sh \
            tests/streamfit_redirect_range.sh tests/streamfit_diagnostico.sh \
            tests/streamfit_paralelo.sh tests/streamfit.sh tests/seekr_vivo.sh \
            tests/manifesto_cache.sh tests/manifesto_wait.sh \
            tests/synccolecoes.sh tests/colfileiras_sync.sh tests/syncordem.sh \
            tests/contaoffline.sh tests/contaoffline_limites.sh tests/sync_aplicar_perf.sh
          for repeat in 2 3; do
            python3 scripts/ci_benchmark.py upstream "focused-evidence/redirect-$repeat" focused-network-repeat \
              tests/streamfit_redirect_range.sh
          done
      - uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        if: always()
        with:
          path: ${{ runner.temp }}/focused-ui-objects
          key: ${{ steps.cache-key.outputs.prefix }}-${{ github.sha }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: focused-settings-account-attempt-${{ github.run_attempt }}
          path: |
            focused-evidence/
            focused-state.json
          if-no-files-found: error
